# GitLab CI/CD 配置
# 任务图编辑器 - 持续集成

stages:
  - format
  - check
  - test
  - build

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: nightly

# 全部质量任务与构建使用一致的 MR / 分支 / 标签条件，避免 needs 指向不存在的任务。
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

.pipeline-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH'

.release-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|master|develop|dev)$/'

# 缓存 cargo 依赖和构建产物（按 Cargo.lock 哈希）
.rust-cache: &rust-cache
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
    policy: pull-push

# 基础镜像配置（含 Bevy 的窗口/图形系统依赖）
.rust-base: &rust-base
  image: rust:latest
  before_script:
    - rustup default ${RUST_TOOLCHAIN}
    - rustup component add rustfmt clippy
    - apt-get update && apt-get install -y
        libssl-dev pkg-config python3
        libxkbcommon-dev libgl1-mesa-dev libwayland-dev
        libx11-dev libxcursor-dev libxrandr-dev libxi-dev
    - rustc --version && cargo --version

# 版本号计算脚本（各 job 复用）
.compute_version: &compute_version
  - |
    VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
    COMMIT=$(git rev-parse --short=7 HEAD)
    DATE=$(date -u +%Y%m%d)
    if [ -n "$CI_COMMIT_TAG" ]; then
      FULL_VERSION="v${VERSION}+${COMMIT}"
    else
      FULL_VERSION="v${VERSION}+${DATE}.${COMMIT}"
    fi
    echo "版本号: ${FULL_VERSION}"

# ============ Check 阶段 ============

fmt:
  extends: .pipeline-rules
  <<: [*rust-base, *rust-cache]
  stage: format
  script:
    - cargo fmt --all -- --check
  allow_failure: false

clippy:
  extends: .pipeline-rules
  needs: [fmt]
  <<: [*rust-base, *rust-cache]
  stage: check
  script:
    - cargo clippy --all --all-targets -- -D warnings
  allow_failure: false

# ============ Test 阶段 ============

test:
  extends: .pipeline-rules
  <<: [*rust-base, *rust-cache]
  stage: test
  script:
    - cargo test --all
    - python3 scripts/test_deploy_remote.py
  needs:
    - clippy

# ============ Build 阶段 ============

# Linux x64 Release
build:linux-x64:
  extends: .release-rules
  <<: [*rust-base, *rust-cache]
  stage: build
  before_script:
    - rustup default ${RUST_TOOLCHAIN}
    - apt-get update && apt-get install -y
        libssl-dev pkg-config
        libxkbcommon-dev libgl1-mesa-dev libwayland-dev
        libx11-dev libxcursor-dev libxrandr-dev libxi-dev
        upx-ucl
    - rustc --version && cargo --version
  script:
    - *compute_version
    - cargo build --release --target x86_64-unknown-linux-gnu
    # ELF 完整性验证
    - |
      EXE="target/x86_64-unknown-linux-gnu/release/task-graph-editor"
      echo "=== 检查动态段 ==="
      readelf -d "$EXE" | head -10
    # UPX 压缩
    - |
      EXE="target/x86_64-unknown-linux-gnu/release/task-graph-editor"
      echo "=== 压缩前 ==="
      ls -lh "$EXE"
      upx --best --lzma "$EXE" || true
      echo "=== 压缩后 ==="
      ls -lh "$EXE"
    # 打包
    - PACKAGE_NAME="task-graph-editor-${FULL_VERSION}-linux-x64"
    - mkdir -p package
    - cp target/x86_64-unknown-linux-gnu/release/task-graph-editor package/
    - echo -n "${FULL_VERSION}" > package/VERSION
    - cd package && tar czf "../${PACKAGE_NAME}.tar.gz" . && cd ..
  artifacts:
    paths:
      - task-graph-editor-*-linux-x64.tar.gz
    expire_in: 30 days
  needs:
    - test

# macOS ARM64 Release（UPX 跳过）
build:macos-arm64:
  extends: .release-rules
  stage: build
  tags:
    - macos
    - arm64
  before_script:
    - brew install pkg-config || true
    - |
      if ! command -v rustup &>/dev/null; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
        source "$HOME/.cargo/env"
      fi
    - rustup default nightly
    - rustup target add aarch64-apple-darwin
  script:
    - *compute_version
    - cargo build --release --target aarch64-apple-darwin
    # 打包 .app bundle
    - |
      PACKAGE_NAME="task-graph-editor-${FULL_VERSION}-macos-arm64"
      APP_NAME="任务图编辑器.app"
      mkdir -p "package/${APP_NAME}/Contents/MacOS"
      mkdir -p "package/${APP_NAME}/Contents/Resources"
      cp target/aarch64-apple-darwin/release/task-graph-editor "package/${APP_NAME}/Contents/MacOS/task-graph-editor"
      cat > "package/${APP_NAME}/Contents/Info.plist" << PLIST_EOF
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
          <key>CFBundleName</key>
          <string>任务图编辑器</string>
          <key>CFBundleDisplayName</key>
          <string>任务图编辑器</string>
          <key>CFBundleIdentifier</key>
          <string>com.task-graph-editor</string>
          <key>CFBundleVersion</key>
          <string>${VERSION}</string>
          <key>CFBundleShortVersionString</key>
          <string>${VERSION}</string>
          <key>CFBundleExecutable</key>
          <string>task-graph-editor</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>NSHighResolutionCapable</key>
          <true/>
          <key>LSMinimumSystemVersion</key>
          <string>11.0</string>
      </dict>
      </plist>
      PLIST_EOF
      cd package
      zip -r -q "../${PACKAGE_NAME}.zip" "${APP_NAME}"
      cd ..
  artifacts:
    paths:
      - task-graph-editor-*-macos-arm64.zip
    expire_in: 30 days
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - target/
    policy: pull-push
  needs:
    - test

# Windows x64 Release
build:windows-x64:
  extends: .release-rules
  stage: build
  tags:
    - windows
    - x64
  before_script:
    - choco install nasm -y
    - rustup default nightly
    - rustup target add x86_64-pc-windows-msvc
  script:
    - $Version = (Select-String -Path Cargo.toml -Pattern '^version\s*=' | Select-Object -First 1).Line -replace '.*"(.*)".*', '$1'
    - $Commit = (git rev-parse --short=7 HEAD)
    - $Date = Get-Date -Format "yyyyMMdd"
    - |
      if ($env:CI_COMMIT_TAG) {
        $FullVersion = "v${Version}+${Commit}"
      } else {
        $FullVersion = "v${Version}+${Date}.${Commit}"
      }
    - 'Write-Host "版本号: ${FullVersion}"'
    - cargo build --release --target x86_64-pc-windows-msvc
    # 不做 UPX 压缩：UPX 加壳的无签名 exe 会触发 Defender/SmartScreen 木马误报
    # 打包
    - $PackageName = "task-graph-editor-${FullVersion}-windows-x64"
    - New-Item -ItemType Directory -Force -Path package
    - Copy-Item "target\x86_64-pc-windows-msvc\release\task-graph-editor.exe" -Destination "package\"
    - $FullVersion | Out-File -FilePath "package\VERSION" -Encoding UTF8 -NoNewline
    - Compress-Archive -Path package\* -DestinationPath "${PackageName}.zip"
  artifacts:
    paths:
      - task-graph-editor-*-windows-x64.zip
    expire_in: 30 days
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - target/
    policy: pull-push
  needs:
    - test

# 其他开发分支构建，同样经过完整测试闸门
build-debug:
  <<: [*rust-base, *rust-cache]
  stage: build
  script:
    - cargo build
  needs:
    - test
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH !~ /^(main|master|develop|dev)$/'
