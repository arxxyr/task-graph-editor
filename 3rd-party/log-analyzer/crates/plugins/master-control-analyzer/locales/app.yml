_version: 2

# 插件元数据
plugin.description:
  zh-CN: "机器人控制系统日志分析器，支持轮次检测、流程分析和甘特图生成"
  en: "Robot control system log analyzer, supporting round detection, flow analysis, and Gantt chart generation"

# 分析摘要
summary.complete:
  zh-CN: "分析完成！"
  en: "Analysis complete!"

summary.rounds_detected:
  zh-CN: "检测到 %{count} 个轮次"
  en: "Detected %{count} rounds"

summary.flows_detected:
  zh-CN: "检测到 %{count} 个导航流程"
  en: "Detected %{count} navigation flows"

summary.action_stats:
  zh-CN: "动作统计: %{nav} 导航, %{preplan} 预打舵, %{arm} 手臂, %{gripper} 夹爪, %{head} 头部, %{waist} 腰部"
  en: "Action stats: %{nav} navigation, %{preplan} pre-plan, %{arm} arm, %{gripper} gripper, %{head} head, %{waist} waist"

summary.csv_records:
  zh-CN: "生成 %{count} 条 CSV 记录"
  en: "Generated %{count} CSV records"

summary.output_dir:
  zh-CN: "输出目录: %{path}"
  en: "Output directory: %{path}"

# 输出文件描述
output.analysis_csv:
  zh-CN: "主分析数据（所有操作的时序记录）"
  en: "Main analysis data (timing records of all operations)"

output.round_gantt:
  zh-CN: "轮次 %{id} 甘特图"
  en: "Round %{id} Gantt chart"

output.action_timeline:
  zh-CN: "动作时间轴汇总表"
  en: "Action timeline summary"

output.cycle_duration_stats:
  zh-CN: "常规循环耗时统计图"
  en: "Normal cycle duration statistics chart"

# 循环类型
cycle.initial:
  zh-CN: "初始循环"
  en: "Initial Cycle"

cycle.normal:
  zh-CN: "常规循环 %{n}"
  en: "Normal Cycle %{n}"

cycle.final:
  zh-CN: "最终循环"
  en: "Final Cycle"

# 甘特图相关
gantt.title_with_pause:
  zh-CN: "%{cycle_type} (Round %{id}) Timeline (有效: %{effective}s, 暂停: %{pause}s, 总计: %{total}s)"
  en: "%{cycle_type} (Round %{id}) Timeline (Effective: %{effective}s, Pause: %{pause}s, Total: %{total}s)"

gantt.title_no_pause:
  zh-CN: "%{cycle_type} (Round %{id}) Timeline (Total: %{total}s)"
  en: "%{cycle_type} (Round %{id}) Timeline (Total: %{total}s)"

gantt.beijing_time:
  zh-CN: "北京时间: %{start} - %{end}"
  en: "Beijing Time: %{start} - %{end}"

gantt.not_ended:
  zh-CN: "未结束"
  en: "Not ended"

gantt.y_label:
  zh-CN: "动作类型"
  en: "Action Type"

gantt.x_label:
  zh-CN: "时间 (相对于轮次开始的秒数)"
  en: "Time (seconds from round start)"

gantt.total_time:
  zh-CN: "总计: %{time}s"
  en: "Total: %{time}s"

